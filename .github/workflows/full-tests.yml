name: Full tests

# コードを変えていなくても、データやサイトが壊れていないかを毎日確かめる（AI は使わない）。
# 検証が走るのは、コードやワークフローを変えた PR のときだけなので、データの更新だけで起きる不具合はここで見つける。
# 失敗すると heal-on-failure が保守エージェントを起動する。毎日 06:30 JST（= 21:30 UTC）。実行は遅れることがある。
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-tests
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate workflows, data and slides
        run: |
          npm run validate:workflows
          npm run validate:data
          npm run validate:slides
      - name: Run the full test suite (builds the site and checks links)
        run: npm test
