name: Pipeline status

# 「Pipeline status」という Issue を 1 つだけ保ち、毎日その内容を更新する。
# Actions タブを開かなくても、スライド・要約の進み具合、各ワークフローの成否、開いている PR・Issue が読める。
# AI は使わない（npm run health の結果を整形するだけ）。毎日 06:10 JST（= 21:10 UTC）。実行は遅れることがある。
on:
  schedule:
    - cron: "10 21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: read

concurrency:
  group: pipeline-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write the report
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_OUT: .work/status.md
        run: npm run health
      - name: Update the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --label pipeline-status --state open --limit 1 --json number -q '.[0].number')
          if [ -z "$number" ]; then
            gh label create pipeline-status --description "Daily automation status" --color 0E8A16 2>/dev/null || true
            gh issue create --title "Pipeline status" --label pipeline-status --body-file .work/status.md
          else
            gh issue edit "$number" --body-file .work/status.md
          fi
      - name: Close stale slide-failure issues once caught up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 未作成のスライドが 0 件なら、過去の生成失敗の報告は役目を終えている。放置すると本当の失敗が埋もれるので閉じる
          pending=$(npm run -s pending-slides -- --limit 1 2>/dev/null || echo "unknown")
          if [ -z "$pending" ]; then
            cutoff=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
            for n in $(gh issue list --state open --limit 100 --label agentic-workflows --json number,title,createdAt -q ".[] | select((.title | test(\"one-update slide JSON\")) and .createdAt < \"$cutoff\") | .number"); do
              gh issue close "$n" -c "スライドの未作成が 0 件になったため、過去の生成失敗の報告として閉じます（毎日の状況確認で自動）。" || true
            done
          fi
