name: Collect updates
run-name: ${{ inputs.document_date && format('Documentation enrichment {0}', inputs.document_date) || 'Collect updates' }}

on:
  workflow_dispatch:
    inputs:
      document_date:
        description: Optional YYYY-MM-DD for documentation-only enrichment (no collection or translation).
        required: false
        type: string
      document_limit:
        description: Maximum important updates to enrich for the selected date.
        required: false
        default: "4"
        type: choice
        options:
          - "4"
          - "12"
  schedule:
    - cron: "15 */6 * * *"

permissions:
  actions: write
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect updates
        if: inputs.document_date == ''
        run: npm run collect

      - name: Verify public Microsoft Learn MCP
        if: inputs.document_date != ''
        env:
          DOCUMENT_DATE: ${{ inputs.document_date }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createLearnLookup } from './scripts/lib/learn-mcp.mjs';
          const date = process.env.DOCUMENT_DATE;
          if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) throw new Error('Invalid documentation date');
          const event = JSON.parse(fs.readFileSync(`data/events/${date}.json`, 'utf8')).events
            .sort((a, b) => (b.importanceScore || 0) - (a.importanceScore || 0))[0];
          if (!event) throw new Error('Selected daily log contains no events');
          const lookup = await createLearnLookup();
          try {
            const documents = await lookup.findDocuments(event);
            console.log(`Public Learn MCP lookup completed: ${documents.length} verified document(s)`);
          } finally {
            await lookup.close();
          }
          NODE

      - name: Enrich selected daily documents
        if: inputs.document_date != ''
        env:
          DOCUMENT_DATE: ${{ inputs.document_date }}
          DOCUMENT_LIMIT: ${{ inputs.document_limit }}
        run: node scripts/enrich-documents.mjs --date "$DOCUMENT_DATE" --limit "$DOCUMENT_LIMIT" --write

      - name: Validate generated data invariants
        run: npm run validate:data

      - name: Generate article and post drafts
        if: inputs.document_date == ''
        run: npm run generate:drafts

      - name: Commit generated updates
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- data summaries drafts config/summary-ja-cache.json config/related-documents.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "pages_changed=false" >> "$GITHUB_OUTPUT"
            echo "No collected changes detected"
            exit 0
          fi

          if git diff --quiet -- data summaries config/related-documents.json; then
            echo "pages_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "pages_changed=true" >> "$GITHUB_OUTPUT"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data summaries drafts config/summary-ja-cache.json config/related-documents.json
          git commit -m "chore: collect daily updates"
          # 収集中に main が進んで push が拒否されたら、rebase して数回だけやり直す
          for attempt in 1 2 3; do
            if git push; then break; fi
            if [ "$attempt" = "3" ]; then echo "push failed after retries"; exit 1; fi
            echo "push rejected; rebasing (attempt $attempt)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || { git rebase --abort || true; exit 1; }
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch Pages deploy
        if: steps.commit.outputs.changed == 'true' && steps.commit.outputs.pages_changed == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-pages.yml',
              ref: 'main',
            });
            core.info('Dispatched Deploy GitHub Pages for the latest collected content.');
