name: Auto-merge slides

# slide エージェントが作った PR を、データだけの変更で、main 側の信頼できるコードで検証・描画確認できたときだけマージする。
on:
  workflow_run:
    workflows: ["Microsoft Copilot Update Digest — one-update slide JSON"]
    types: [completed]
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Japanese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Validate, render-check and merge eligible PRs
        env:
          GH_TOKEN: ${{ github.token }}
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          merged=false
          while read -r n sha; do
            echo "== PR #$n @ $sha"
            files=$(gh pr view "$n" --json files -q '.files[].path')
            if [ "$(echo "$files" | wc -l)" -ne 1 ] || ! echo "$files" | grep -Eq '^data/slides/[A-Za-z0-9._-]+\.json$'; then
              echo "skip: must change exactly one data/slides/<id>.json:"; echo "$files"; continue
            fi
            f="$files"; id=$(basename "$f" .json)
            git fetch -q origin "pull/$n/head"
            if [ "$(git rev-parse FETCH_HEAD)" != "$sha" ]; then echo "skip: head moved while checking"; continue; fi
            git reset -q --hard origin/main
            git checkout -q FETCH_HEAD -- "$f"
            if ! npm run -s validate:slides; then echo "skip: validation failed"; git reset -q --hard origin/main; continue; fi
            if ! npm run -s pdf -- --ids "$id" --out .slide-check; then echo "skip: render check failed"; git reset -q --hard origin/main; rm -rf .slide-check; continue; fi
            git reset -q --hard origin/main
            git clean -fdq data/slides
            rm -rf .slide-check
            gh pr merge "$n" --squash --match-head-commit "$sha" && merged=true
          done < <(gh pr list --state open --limit 100 --base "${{ github.event.repository.default_branch }}" --json number,title,headRefOid,labels \
              -q '.[] | select((.title | startswith("[slides] ")) and (.labels | map(.name) | index("data"))) | "\(.number) \(.headRefOid)"')
          if [ "$merged" = "true" ]; then
            gh workflow run deploy-pages.yml --ref "${{ github.event.repository.default_branch }}"
          fi
